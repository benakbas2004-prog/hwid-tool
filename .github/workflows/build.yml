name: build
on: push

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: ilammy/msvc-dev-cmd@v1

      - name: compile
        shell: cmd
        run: cl /EHsc /std:c++17 hwid_spoof.cpp /link iphlpapi.lib advapi32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: hwid_spoof
          path: hwid_spoof.exe
